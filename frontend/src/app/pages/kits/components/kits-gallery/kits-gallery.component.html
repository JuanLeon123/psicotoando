<ul class="kits-gallery" aria-label="Actividades de la Caja W°alli">
  @for (photo of photos; track photo.image; let first = $first) {
    <li>
      <img
        [ngSrc]="photo.image"
        fill
        [priority]="first"
        sizes="(max-width: 1024px) 50vw, 25vw"
        [alt]="photo.alt"
      />
    </li>
  }
</ul>
