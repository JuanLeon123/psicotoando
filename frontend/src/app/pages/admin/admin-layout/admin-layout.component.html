<a class="skip-link" href="#admin-main">Saltar al contenido</a>
<div class="admin-shell">
  <header class="admin-topbar">
    <a class="brand" routerLink="/admin" aria-label="Panel de Psico T.O ando">
      <img src="images/brand-mark.svg" alt="" width="40" height="40" />
      <span>Panel</span>
    </a>
    <button
      class="menu-toggle"
      type="button"
      aria-controls="admin-sidebar"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="menuOpen.set(!menuOpen())"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
    </button>
  </header>

  <aside
    id="admin-sidebar"
    class="admin-sidebar"
    [class.is-open]="menuOpen()"
    (keydown.escape)="menuOpen.set(false)"
  >
    <a class="brand brand--sidebar" routerLink="/admin">
      <img src="images/brand-mark.svg" alt="" width="44" height="44" />
      <span>
        <strong>Psico T.O ando</strong>
        <small>Panel de administración</small>
      </span>
    </a>
    <nav class="admin-nav" aria-label="Secciones del panel">
      @for (link of links; track link.path) {
        <a
          class="nav-item"
          [routerLink]="link.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          ariaCurrentWhenActive="page"
          ><app-icon [name]="link.icon" />{{ link.label }}</a
        >
      }
    </nav>
    <div class="sidebar-footer">
      <a class="nav-item" routerLink="/tienda"
        ><app-icon name="cart" />Ver tienda</a
      >
      @if (auth.user(); as user) {
        <p class="admin-user">
          <span class="admin-initial" aria-hidden="true">{{
            user.fullName.charAt(0)
          }}</span>
          <span>
            <strong>{{ user.fullName }}</strong>
            <small>{{ user.email }}</small>
          </span>
        </p>
      }
      <button
        class="button button--ghost sign-out"
        type="button"
        [attr.aria-disabled]="signingOut()"
        (click)="signingOut() || signOut()"
      >
        {{ signingOut() ? "Cerrando sesión…" : "Cerrar sesión" }}
      </button>
    </div>
  </aside>

  <main id="admin-main" class="admin-main" tabindex="-1">
    <router-outlet />
  </main>
</div>
