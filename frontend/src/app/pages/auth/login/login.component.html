<app-auth-layout
  heading="Inicia sesión"
  intro="Accede a tu cuenta para gestionar tus datos y acompañar el proceso de tu familia."
>
  <form class="form-stack" novalidate (ngSubmit)="submit()" [formGroup]="form">
    <div class="live-region" aria-live="assertive">
      @if (serverError()) {
        <p class="form-alert form-alert--error">{{ serverError() }}</p>
      }
    </div>
    <div class="form-field">
      <label class="form-label" for="login-email">Correo electrónico</label>
      <input
        class="form-input"
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
        autocapitalize="off"
        spellcheck="false"
        aria-required="true"
        [attr.aria-invalid]="!!errorFor('email')"
        [attr.aria-describedby]="errorFor('email') ? 'login-email-error' : null"
      />
      @if (errorFor("email"); as message) {
        <p class="form-error" id="login-email-error">{{ message }}</p>
      }
    </div>
    <div class="form-field">
      <label class="form-label" for="login-password">Contraseña</label>
      <app-password-field
        inputId="login-password"
        [control]="form.controls.password"
        autocomplete="current-password"
        [invalid]="!!errorFor('password')"
        [describedBy]="errorFor('password') ? 'login-password-error' : ''"
      />
      @if (errorFor("password"); as message) {
        <p class="form-error" id="login-password-error">{{ message }}</p>
      }
      <a class="text-link forgot-link" routerLink="/recuperar-contrasena"
        >¿Olvidaste tu contraseña?</a
      >
    </div>
    <button
      class="button button--primary form-submit"
      type="submit"
      [attr.aria-disabled]="pending() || null"
    >
      {{ pending() ? "Iniciando sesión…" : "Iniciar sesión" }}
    </button>
  </form>
  <app-google-sign-in-button [returnUrl]="returnUrl" />
  <p class="auth-switch">
    ¿Aún no tienes cuenta?
    <a
      class="text-link"
      routerLink="/registro"
      [queryParams]="returnUrl ? { returnUrl } : {}"
      >Crea una cuenta</a
    >
  </p>
</app-auth-layout>
