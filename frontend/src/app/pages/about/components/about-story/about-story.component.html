<section class="story" aria-labelledby="about-title">
  <div class="story-text">
    <h1 id="about-title">Sobre <span>nosotros</span></h1>
    <p class="story-tagline">
      Acompañamos a las familias en cada paso del desarrollo.
    </p>
    <div class="story-copy">
      @for (paragraph of paragraphs; track $index) {
        <p>{{ paragraph }}</p>
      }
    </div>
  </div>
  <figure class="story-visual">
    <div class="story-photo">
      <img
        [ngSrc]="photo().url"
        fill
        priority
        sizes="(max-width: 1024px) 100vw, 40vw"
        [alt]="photo().alt"
        [style.object-position]="photo().position"
      />
    </div>
    <figcaption class="story-note">
      <app-icon name="heart" />
      <p>
        Creemos que cuando las familias juegan con propósito, los niños
        florecen.
      </p>
    </figcaption>
  </figure>
</section>
