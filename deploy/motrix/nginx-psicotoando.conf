# psicotoando.com — web Angular (archivos en /home/motrix/psicotoando/web) + API NestJS
# (pm2 "psicotoando-api" en 127.0.0.1:3200). Llega por el túnel Cloudflare "motrix" → 127.0.0.1:8087.

limit_req_zone $binary_remote_addr zone=psicotoando_api:10m rate=300r/m;

server {
    listen 127.0.0.1:8087;
    server_name www.psicotoando.com;
    return 301 https://psicotoando.com$request_uri;
}

server {
    listen 127.0.0.1:8087;
    server_name psicotoando.com;

    root /home/motrix/psicotoando/web;
    index index.html;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/psicotoando.access.log;
    error_log  /var/log/nginx/psicotoando.error.log warn;

    # Los videos del blog llegan a 80 MB.
    client_max_body_size 90m;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ /\.(?!well-known) { deny all; }

    # API (NestJS en pm2), incluidas las imágenes subidas en /api/uploads.
    # ^~ para que la regla de archivos estáticos de abajo no capture /api/uploads/*.png.
    location ^~ /api/ {
        limit_req zone=psicotoando_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Archivos con hash: caché larga. index.html: siempre revalidar.
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|svg|ico|webp|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rutas de la app (SPA).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
